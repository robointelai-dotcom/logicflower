server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 10240;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

  location = /robots.txt {
    proxy_pass http://api:4000/api/v1/public/content/robots.txt;
    proxy_set_header Host $host;
  }

  location = /sitemap.xml {
    proxy_pass http://api:4000/api/v1/public/content/sitemap.xml;
    proxy_set_header Host $host;
  }

  location = /rss.xml {
    proxy_pass http://api:4000/api/v1/public/content/rss.xml;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 105m;
  }

  location = /healthz {
    proxy_pass http://api:4000/healthz;
  }

  location = /readyz {
    proxy_pass http://api:4000/readyz;
  }

  # A blog article's metadata lives in the database, so the build cannot bake it
  # in. The API returns the same shell with the head already filled, and the
  # bundle hydrates over it.
  #
  # Without this, sharing an article shows the homepage blurb, and every crawler
  # that does not run JavaScript reads one generic description for every
  # article. The regex deliberately excludes the blog index, which IS prerendered.
  location ~ ^/blog/(?<article_slug>[a-z0-9-]+)$ {
    proxy_pass http://api:4000/api/v1/public/content/article-shell/$article_slug;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
    add_header Cache-Control "public, max-age=300";
  }

  location ~ ^/(dashboard|login|register|signup|forgot-password|reset-password|mfa-|settings|admin|reports|clients|agency|onboarding|forbidden|setup|connections|platform|booking|estate|website|access-ledger|sequences|contacts|pipeline|inbox|trypost|social|voice|workflows|executions|batches|monitoring|vault|notifications|audit|billing|team) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(help|status|book|features|compare|solutions|blog)(/|$) {
    try_files $uri $uri/ /index.html;
  }

  location / {
    # If a path isn't statically prerendered and doesn't match an SPA route, return a hard 404.
    # We still try $uri/ so the homepage prerender directory works.
    try_files $uri $uri/ =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    try_files $uri =404;
  }
}
